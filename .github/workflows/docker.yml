name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/invoice_images:backend-1.0 \
            ./backend

      - name: Build Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/invoice_images:frontend-1.0 \
            ./frontend

      - name: Build AI Service
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/invoice_images:ai-1.0 \
            ./ai-services

      - name: Push Backend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/invoice_images:backend-1.0

      - name: Push Frontend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/invoice_images:frontend-1.0

      - name: Push AI Service
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/invoice_images:ai-1.0